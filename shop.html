<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steampunk Transition</title>
    <style>
        :root {
            --gold: #bda25c;
            --copper: #8c5230;
            --dark-bronze: #2b1f1d;
            --rust: #5c2c16;
            --cream: #eae1cc;
        }
        body, html {
          background-image: url('images/2026_09.webp') ;
          background-repeat: no-repeat;
          background-attachment: fixed;  
          background-size: cover;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Georgia', serif;
            overflow: hidden;
            background-color: var(--dark-bronze);
            color: var(--cream);
        }

        /* Slide Container */
        .presentation-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: transform 1s cubic-bezier(0.77, 0, 0.175, 1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        /* Slide 1: Steampunk Shop */
        #slide-shop {
            background: radial-gradient(circle, #422f27 0%, #1a1210 100%);
            border: 15px solid var(--copper);
            box-shadow: inset 0 0 100px rgba(0,0,0,0.8);
            z-index: 2;
        }

        #slide-shop::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(189, 162, 92, 0.05) 50%, rgba(0, 0, 0, 0.2) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        .shop-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .shop-header h1 {
            font-size: 3.5rem;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 4px;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6), 0 0 20px var(--rust);
        }

        .shop-header p {
            font-style: italic;
            color: #a89475;
            margin-top: 10px;
        }

        /* Showcase Grid */
        .showcase {
            display: flex;
            gap: 30px;
            margin-bottom: 50px;
        }

        .item-card {
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid var(--gold);
            padding: 20px;
            width: 200px;
            text-align: center;
            border-radius: 4px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            position: relative;
        }

        .item-card .gear-icon {
            font-size: 3rem;
            color: var(--copper);
            margin-bottom: 15px;
            animation: spin 10s linear infinite;
        }

        .item-card:nth-child(2) .gear-icon {
            animation: spin-reverse 7s linear infinite;
        }

        .item-card h3 {
            margin: 10px 0;
            color: var(--gold);
            font-size: 1.2rem;
        }

        .item-card .price {
            color: #d1b475;
            font-weight: bold;
        }

        /* Steampunk Button */
        .steam-btn {
            background: linear-gradient(135deg, var(--rust) 0%, var(--copper) 100%);
            border: 3px solid var(--gold);
            color: var(--cream);
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5), inset 0 0 10px rgba(255,255,255,0.2);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .steam-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(189, 162, 92, 0.4);
            background: linear-gradient(135deg, var(--copper) 0%, var(--rust) 100%);
        }

        .steam-btn:active {
            transform: translateY(1px);
        }

        /* Slide 2: Your Custom Slide */
        #slide-custom {
            background-color: #f4f4f9;
            color: #333;
            z-index: 1;
            /* Hidden initially to the right, will slide in */
            transform: translateX(100%); 
        }

        /* Active State Classes */
        .presentation-container.transitioned #slide-shop {
            transform: translateX(-100%);
        }

        .presentation-container.transitioned #slide-custom {
            transform: translateX(0);
        }

        /* Animations */
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
        @keyframes spin-reverse {
            100% { transform: rotate(-360deg); }
        }
        
        /* Back Button for testing */
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 8px 15px;
            background: #333;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="presentation-container" id="deck">

        <!-- SLIDE 1: FAKE STEAMPUNK SHOP -->
        <div class="slide" id="slide-shop">
            <div class="shop-header">
                <h1>Brass &amp; Boiler</h1>
                <p>Purveyors of Fine Aetherware &amp; Chronographs</p>
            </div>

            <div class="showcase">
                <div class="item-card">
                    <div class="gear-icon">⚙️</div>
                    <h3>Aether Goggles</h3>
                    <p class="price">45 mG</p>
                </div>
                <div class="item-card">
                    <div class="gear-icon">⚙️</div>
                    <h3>Pocket Chrono</h3>
                    <p class="price">120 mG</p>
                </div>
            </div>

            <button class="steam-btn" onclick="nextSlide()">Enter Online Shop ➔</button>
        </div>

        <!-- SLIDE 2: YOUR SLIDE -->
        <div class="slide" id="slide-custom">
            <button class="back-btn" onclick="prevSlide()">⇠ Back to Shop</button>
            
            <!-- Replace this content with your own slide layout -->
            <div style="text-align: center; max-width: 800px; padding: 40px;">
                <!--<h2 style="font-size: 3rem; margin-bottom: 20px; color: #222;">Your Main Presentation</h2>
                <p style="font-size: 1.2rem; line-height: 1.6; color: #555;">
                    This is your actual slide content. You can put your text, charts, images, or project info here. The transition uses a clean CSS slide effect to move seamlessly from the shop theme into your workspace.
                </p>-->
                <p ><img src="images/signature.jpeg" alt="signature" style="width:100%"></p>
            </div>
        </div>

    </div>
    <script>
        function nextSlide() {
            document.getElementById('deck').classList.add('transitioned');
        }

        function prevSlide() {
            document.getElementById('deck').classList.remove('transitioned');
        }
    </script>
</body>
</html>
